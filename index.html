<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="우당탕탕 아이쿠·은하안전단·호기심딱지 공식 영상 110편의 학년별 수업 활동지. PDF 저장과 인쇄 지원."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>만화 수업 활동지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 왼쪽은 유튜브식 영상 목록(썸네일 + 제목 + 학년 버튼), 오른쪽은 종이 활동지(넓은 화면에서 고정). 좁은 화면에서는 위아래로 쌓임 */
:root{
  --bg:#eef1f4;--paper:#ffffff;--ink:#1f2a37;--muted:#5d6b7a;--line:#cfd6de;
  --accent:#ffd84d;--accent-ink:#5a4600;
  --aiku:#e8702a;--galaxy:#4f5bd5;--curio:#2e9b6a;--pen:#c0392b;--chip:#e3e8ee;--on-sc:#ffffff;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-pen:"Nanum Pen Script","Gowun Dodum",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a21;--paper:#1d252e;--ink:#e6ebf0;--muted:#9aa8b6;--line:#34414e;
  --accent:#ffd84d;--accent-ink:#2b2200;--aiku:#ff9150;--galaxy:#8d95ff;--curio:#4cc792;
  --pen:#ff7a6b;--chip:#2a3541;--on-sc:#141a21;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a21;--paper:#1d252e;--ink:#e6ebf0;--muted:#9aa8b6;--line:#34414e;
  --accent:#ffd84d;--accent-ink:#2b2200;--aiku:#ff9150;--galaxy:#8d95ff;--curio:#4cc792;
  --pen:#ff7a6b;--chip:#2a3541;--on-sc:#141a21;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.sr{position:absolute;left:-9999px}
button{font:inherit}

/* 머리말 */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--ink);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.logo i{position:absolute;width:22px;height:30px;border-radius:3px;background:var(--paper);transform:rotate(-8deg);left:10px;top:11px}
.logo b{position:absolute;width:22px;height:30px;border-radius:3px;background:var(--accent);transform:rotate(7deg);left:20px;top:10px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--sc,var(--ink));font-variant-numeric:tabular-nums}

/* 검색 */
.searchbar{display:grid;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px;box-shadow:0 1px 0 var(--line)}
.sfield{position:relative}
.sfield svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.searchbar input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.searchbar input:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--sc,var(--ink))}
.chip[aria-pressed="true"]{background:var(--sc,var(--ink));border-color:var(--sc,var(--ink));color:var(--on-sc)}
.chip:not([class*="s-"])[aria-pressed="true"]{color:var(--paper)}
.chip[aria-pressed="true"] .dot{background:var(--on-sc)}
.hint{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center}
.hint button{color:var(--ink);background:var(--chip);border:none;border-radius:6px;cursor:pointer;padding:1px 8px;margin-left:4px}
.hint button:hover{background:var(--accent);color:var(--accent-ink)}

main.grid{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){main.grid{grid-template-columns:minmax(0,1fr)}}
@media (min-width:1001px){.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow-y:auto;padding:0 6px 12px 0}}

/* 영상 목록 */
.s-aiku{--sc:var(--aiku)}.s-galaxy{--sc:var(--galaxy)}.s-curio{--sc:var(--curio)}
.list{display:flex;flex-direction:column;gap:8px}
.count{font-size:13px;color:var(--muted);margin:0 0 2px}
.item{display:grid;grid-template-columns:168px minmax(0,1fr);gap:14px;padding:10px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.item:hover{border-color:var(--sc)}
.item.sel{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc)}
@media (max-width:480px){.item{grid-template-columns:124px minmax(0,1fr);gap:10px}}
.thumb{position:relative;display:block;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--chip);align-self:start}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:rgba(0,0,0,.4);color:#fff;font-size:13px;font-weight:700}
.thumb:hover .play,.thumb:focus-visible .play{opacity:1}
.info{min-width:0;display:flex;flex-direction:column;gap:3px}
.info h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.meta b{font-weight:700;color:var(--sc)}
.topic{display:inline-block;font-size:12px;background:var(--chip);color:var(--ink);border-radius:5px;padding:0 6px;margin-right:4px}
.grades{display:inline-flex;margin-top:6px;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;align-self:flex-start}
.grade{font-size:12px;padding:4px 10px;border:none;background:transparent;color:var(--ink);cursor:pointer}
.grade+.grade{border-left:1.5px solid var(--ink)}
.grade:hover{background:var(--chip)}
.grade[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}

/* 도구 막대 */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
.btn{font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.55;cursor:progress}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--on-sc)}
.tb-spacer{flex:1}
.toast{font-size:13px;color:var(--muted);width:100%;padding:0 4px}
.toast:empty{display:none}
.toast.ok{color:var(--curio)}.toast.err{color:var(--pen)}
.btn:focus-visible,.grade:focus-visible,.chip:focus-visible,input:focus-visible,.thumb:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 활동지 */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px -26px rgba(15,25,40,.45)}
.sheet .inner{padding:clamp(18px,3.4vw,34px);padding-top:18px}
.band{background:var(--sc);color:var(--on-sc);padding:18px clamp(18px,3.4vw,34px) 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
.band .kick{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700}
.band .kick span{background:rgba(255,255,255,.22);border-radius:6px;padding:2px 8px}
.band .kick span.gr{background:var(--accent);color:var(--accent-ink)}
.band h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,32px);margin:6px 0 0;line-height:1.2;text-wrap:balance}
.namebox{display:grid;grid-template-columns:auto 96px;gap:5px 8px;font-size:12px;background:#fff;color:#1f2a37;border-radius:8px;padding:8px 10px;align-self:end}
.namebox span:nth-child(even){border-bottom:1px solid #1f2a37;min-height:20px}
@media (max-width:560px){.band{grid-template-columns:minmax(0,1fr)}.namebox{grid-template-columns:auto minmax(0,1fr)}}
.goalrow{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center;padding-bottom:16px;margin-bottom:18px;border-bottom:2px dashed var(--line)}
.goalrow img{width:100%;border-radius:8px;display:block;aspect-ratio:16/9;object-fit:cover}
.goalrow .gl{font-size:14px}
.goalrow .gl b{display:inline-block;font-size:11px;letter-spacing:.04em;color:var(--sc);border:1.5px solid var(--sc);border-radius:5px;padding:0 6px;margin-right:6px}
.goalrow .gl p{margin:0 0 4px}
.goalrow .gl small{color:var(--muted);word-break:break-all}
.goalrow .gl small a{color:var(--muted)}
@media (max-width:460px){.goalrow{grid-template-columns:minmax(0,1fr)}.goalrow img{max-width:200px}}
section.q{margin-bottom:24px}
.q h4{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q h4 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--sc);color:var(--on-sc);font-size:16px;flex:none}
.q h4 small{font-family:var(--f-body);font-size:12px;color:var(--muted);flex-basis:100%;padding-left:40px;margin-top:-6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px solid var(--sc);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:15px}
.bank b{font-family:var(--f-display);font-weight:400;color:var(--sc);margin-right:4px}
.bank span{background:var(--chip);border-radius:6px;padding:1px 9px}
ol.fill{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:12px;font-size:16px}
ol.fill li::marker{color:var(--sc);font-weight:700}
.blank{display:inline-block;border-bottom:2px solid var(--ink);min-width:5em;text-align:center;line-height:1.3;margin:0 3px}
.ans{font-family:var(--f-pen);color:var(--pen);font-size:22px;line-height:1}
.choose{white-space:nowrap}
.choose span{padding:0 5px;border-radius:999px}
.choose .pick{border:2px solid var(--pen);color:var(--pen)}
table.ox{width:100%;border-collapse:collapse;font-size:15px}
table.ox td{border-bottom:1px dashed var(--line);padding:9px 4px;vertical-align:middle}
table.ox td.mark{width:110px;text-align:center;white-space:nowrap;color:var(--muted)}
table.ox td.mark .box{display:inline-flex;gap:6px}
table.ox td.mark .box i{display:inline-grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line);border-radius:7px;font-style:normal}
table.ox td.mark .ans{font-size:26px}
.prompt{margin:0 0 8px;font-size:16px}
.lines{display:flex;flex-direction:column}
.lines i{display:block;height:36px;border-bottom:1px solid var(--line)}
.drawbox{border:2px dashed var(--sc);border-radius:14px;min-height:340px;margin-top:6px;position:relative}
.drawbox::after{content:"✎ 그림 그리는 곳";position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--muted);background:var(--paper);padding:0 4px}
.drawbox.small{min-height:280px}
.promise{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:end}
.promise b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--sc)}
.promise i{display:block;height:34px;border-bottom:1px solid var(--line)}
.case{margin-bottom:12px}
.case q{font-weight:700}
.hintline{font-size:13px;color:var(--pen);margin:0 0 4px}
.self{display:grid;grid-template-columns:auto repeat(2,minmax(0,1fr));gap:8px 14px;align-items:center;font-size:14px;border-top:2px solid var(--ink);padding-top:12px}
.self b{font-family:var(--f-display);font-weight:400;font-size:16px}
.self span{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:8px;padding:6px 10px}
.self em{font-style:normal;letter-spacing:2px;color:var(--sc)}
@media (max-width:560px){.self{grid-template-columns:minmax(0,1fr)}}

/* 교사용 */
.teacher{border:2px solid var(--pen);border-radius:12px;padding:18px 20px;background:var(--paper)}
.teacher h3{font-family:var(--f-display);font-weight:400;color:var(--pen);font-size:21px;margin:0 0 12px}
.std{display:grid;gap:10px;margin-bottom:14px}
.std div{border-left:4px solid var(--pen);padding:2px 0 2px 12px}
.std .subj{font-size:12px;font-weight:700;color:var(--muted)}
.std p{margin:2px 0 0}
.teacher dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0;font-size:14px}
.teacher dt{font-weight:700;white-space:nowrap}
.teacher dd{margin:0}
.note{font-size:12px;color:var(--muted);margin:12px 0 0}

/* PDF 만들기용(화면 밖) */
.pdf-root{position:fixed;left:-20000px;top:0;
  --bg:#f1f3f6;--paper:#fff;--ink:#1f2a37;--muted:#5d6b7a;--line:#cfd6de;--chip:#e6eaef;--pen:#c0392b;
  --aiku:#e8702a;--galaxy:#4f5bd5;--curio:#2e9b6a;--accent:#ffd84d;--accent-ink:#5a4600;--on-sc:#fff;color:var(--ink)}
.pdf-page{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;font-size:15px}
.pdf-page .sheet{border:none;border-radius:0;box-shadow:none;overflow:visible}
.pdf-page .inner{padding:22px 46px 0}
.pdf-page .band{padding:22px 46px 18px}
.pdf-page .cont{padding:28px 46px 0}
.pdf-foot{position:absolute;left:46px;right:46px;bottom:22px;display:flex;justify-content:space-between;font-size:11px;color:#8a96a3;border-top:1px solid #dfe4ea;padding-top:6px}
.pdf-page .teacher{margin:0}

/* 진행 표시 */
.busy{position:fixed;inset:0;background:rgba(15,20,28,.45);display:grid;place-items:center;z-index:50;padding:16px}
.busy div{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 22px;font-size:15px;max-width:340px;text-align:center}
.busy progress{width:100%;margin-top:10px;accent-color:var(--ink)}

@media (prefers-reduced-motion:no-preference){.item,.grade,.chip,.thumb .play,.btn{transition:background .15s,border-color .15s,opacity .15s}}
@page{size:A4;margin:10mm}
@media print{
  :root,:root[data-theme="dark"]{--bg:#f1f3f6;--paper:#fff;--ink:#1f2a37;--muted:#5d6b7a;--line:#cfd6de;--chip:#e6eaef;--pen:#c0392b;--aiku:#e8702a;--galaxy:#4f5bd5;--curio:#2e9b6a;--accent:#ffd84d;--accent-ink:#5a4600;--on-sc:#fff;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:14px}
  .wrap{padding:0;max-width:none}
  .searchbar,.list,.toolbar,header.top,.busy{display:none!important}
  main.grid{display:block}
  .side{position:static!important;max-height:none!important;overflow:visible!important;padding:0!important}
  .sheet{border:none;box-shadow:none;border-radius:0}
  section.q,.goalrow,.self,.case,ol.fill li,table.ox tr{break-inside:avoid}
  .q h4{break-after:avoid}
  .teacher{break-before:page;border-width:1.5px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true"><i></i><b></b></div>
      <div><h1>만화 수업 활동지</h1><p class="sub">공식 영상 <span id="total"></span>편 · 썸네일을 누르면 영상, 학년을 누르면 활동지가 열려요</p></div></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="searchbar">
    <label for="q" class="sr">키워드 검색</label>
    <div class="sfield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="키워드로 찾기 (예: 겨울안전, 여름방학, 횡단보도, 심장)" autocomplete="off"></div>

</div>

<script>
/* 회차별 활동지 데이터. 빈칸은 [정답]. v=유튜브 영상 ID, ep=회차, w=계절·시기 */
const T = [
/* ───────── 우당탕탕 아이쿠 ───────── */
{v:"aFJ9wRFqCoU",s:"aiku",ep:"1기 1화",t:"지구에 오신 걸 환영해요 왕자님!",topic:"교차로 안전",c:"traffic",d:"6:52",w:"봄 새학기 체험학습",kw:"교차로 신호등 자동차 우회전 건널목",
 goal:"교차로에서 차가 오는 방향을 살피고 신호를 지켜 안전하게 건널 수 있다.",

const THEMES=["겨울","여름","봄","가을","방학","새학기","명절","체험학습","장마","실내","야외"];
const ALIAS={"개학":"새학기","신학기":"새학기","입학":"새학기","현장학습":"체험학습","소풍":"체험학습","수학여행":"체험학습","설날":"명절","설":"명절","추석":"명절","휴가":"방학","장마철":"장마"};
const GENERIC=["안전교육","안전","교육","수업","활동지","예방","지도","생활"];

const state={q:"",series:"all",v:T[0].v,band:"12",teacher:false};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const watch=t=>"https://www.youtube.com/watch?v="+t.v;

function parseQuery(q){
  const vocab=THEMES.concat(Object.keys(ALIAS)).sort((a,b)=>b.length-a.length);
  const themes=[],words=[];
  q.split(/\s+/).filter(Boolean).forEach(tok=>{
    let rest=tok;
    vocab.forEach(v=>{if(rest.includes(v)){themes.push(ALIAS[v]||v);rest=rest.split(v).join(" ")}});
    rest.split(" ").filter(Boolean).forEach(r=>{
      let w=r;GENERIC.forEach(g=>{if(w!==g&&w.endsWith(g)&&w.length>g.length)w=w.slice(0,-g.length)});
      if(w&&!GENERIC.includes(w)) words.push(w); else if(w==="안전"&&!themes.length) words.push("안전");
    });
  });
  return {themes:[...new Set(themes)],words};
}
const SAFETY_C=["traffic","life","personal","violence","drug","disaster","firstaid"];
function matches(t,q){
  if(!q) return true;
  const {themes,words}=parseQuery(q);
  const hay=(t.t+t.topic+t.kw+t.ep+SERIES[t.s].name+t.goal+STD[t.c].area+t.w).replace(/\s/g,"").toLowerCase();
  return themes.every(th=>t.w.split(" ").includes(th)) &&
    words.every(w=>w==="안전"?SAFETY_C.includes(t.c)||t.s!=="curio":hay.includes(w.toLowerCase()));
}

function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
/* 1~2학년 고르기 보기: 반대말 사전 → 같은 회차의 다른 낱말 → 같은 분류 회차의 낱말 */
const OPP={"초록불":"빨간불","빨간불":"초록불","천천히":"빨리","빨리":"천천히","빨라져요":"느려져요","느려져요":"빨라져요","앉아서":"서서","뛰지":"걷지","걷지":"뛰지","멈춰요":"달려요","멈추지":"달리지","작게":"크게","크게":"작게","낮추고":"높이고","따뜻한":"시원한","차갑게":"뜨겁게","좌우":"앞만","왼쪽":"위쪽","싫어요":"좋아요","좋아요":"싫어요","전":"후","줄여요":"늘려요","멀리":"가까이","가까이":"멀리","흐르는 찬물":"뜨거운 물","찬물":"뜨거운 물","젖은 손":"마른 손","긁지":"문지르지","손잡이":"날","안쪽":"바깥쪽","바깥쪽":"안쪽","같은 방향":"반대 방향","한 사람":"두 사람","인도":"차도","계단":"엘리베이터","엘리베이터":"계단","나와요":"들어가요","쉬어요":"뛰어요","쉬고":"뛰고","침착하게":"급하게","따로":"같이","적게":"많이","조금만":"많이","조금씩":"한꺼번에","여러 겹":"한 겹","밝은 색":"어두운 색","어른":"친구","보호자":"친구","119":"114","112":"114","해마다":"한 번만","빠르게":"느리게","작아요":"커요","커요":"작아요","얇은":"두꺼운","건조":"축축"};
function choice12(t,ans,i){
  if(typeof CH!=="undefined"&&CH[t.v]&&CH[t.v][i]&&CH[t.v][i]!==ans) return CH[t.v][i];
  if(OPP[ans]) return OPP[ans];
  const own=answers(t.f).filter(a=>a!==ans);
  const sameLen=own.filter(a=>Math.abs(a.length-ans.length)<=2);
  const pool=sameLen.length?sameLen:own;
  return pool[hash(t.v+i)%pool.length];
}
/* 3~4학년 낱말 상자의 함정 낱말: 같은 분류 다른 회차의 낱말 */
function bankExtra(t){
  const mine=answers(t.f);
  const pool=[];T.forEach(x=>{if(x.c===t.c&&x.v!==t.v)answers(x.f).forEach(a=>{if(!mine.includes(a)&&!pool.includes(a))pool.push(a)})});
  return pool.length?pool[hash(t.v)%pool.length]:"";
}

    add("스스로 생각해요","",`<p class="prompt">${esc(t.th[1])}</p>${linesH(4)}`,`  ${t.th[1]}\n`+linesT(4));
    add("나의 약속 세 가지","",`<p class="prompt">${esc(t.ap[1])}</p><div class="promise">${["하나","둘","셋"].map(x=>`<b>${x}.</b><i></i>`).join("")}</div>`,`  ${t.ap[1]}\n  하나. ____________\n  둘. ____________\n  셋. ____________`);
  }
  else{
    add("핵심 내용 쓰기","낱말 상자 없이 영상에서 들은 말을 써요",
      `<ol class="fill">${t.f.map(f=>`<li>${blankify(f,show)}</li>`).join("")}</ol>`,
      t.f.map((f,i)=>`  ${i+1}) ${plainBlank(f)}`).join("\n"));
    const wrong=t.ox.filter(o=>!o[1]).slice(0,2);
    if(wrong.length) add("친구에게 조언하기","틀린 생각을 찾아 영상 내용을 근거로 바로잡아요",
      wrong.map(o=>`<div class="case"><p class="prompt">친구가 <q>${esc(o[0])}</q>라고 말했어요. 무엇이 잘못되었고, 어떻게 조언할까요?</p>${show?`<p class="hintline">교사 참고: 이 생각은 틀렸습니다(×). 핵심 내용 ${t.f.length}문장을 근거로 고쳐 말하게 하세요.</p>`:""}${linesH(3)}</div>`).join(""),
      wrong.map(o=>`  친구가 "${o[0]}"라고 말했어요. 무엇이 잘못되었고, 어떻게 조언할까요?\n`+linesT(3)).join("\n"));
    add("요약하고 고르기","핵심 내용을 내 말로 정리해요",
      `<p class="prompt">① 영상 전체 내용을 두 문장으로 요약해 보세요.</p>${linesH(2)}<p class="prompt" style="margin-top:10px">② 1번의 다섯 문장 중 가장 중요하다고 생각하는 문장의 번호와 그 까닭을 써 보세요.</p><div class="promise"><b>번호</b><i></i><b>까닭</b><i></i></div>${linesH(1)}`,
      "  ① 영상 전체 내용을 두 문장으로 요약해 보세요.\n"+linesT(2)+"  ② 1번의 다섯 문장 중 가장 중요한 문장의 번호와 까닭: 번호 (    )\n"+linesT(2));
    add("탐구하기","",`<p class="prompt">${esc(t.th[2])}</p>${linesH(5)}`,`  ${t.th[2]}\n`+linesT(5));
    add("프로젝트","",`<p class="prompt">${esc(t.ap[2])}</p>${linesH(6)}`,`  ${t.ap[2]}\n`+linesT(6));
    add("새로 안 점, 더 알고 싶은 점","",`<div class="promise"><b>새로 안 점</b><i></i><b>궁금한 점</b><i></i></div>`,"  새로 안 점: ____________\n  궁금한 점: ____________");
  }
  return sec;
}
function teacherAnswers(t,band){
  if(band==="12"){const f=t.f.slice(0,3);return {fill:answers(f),ox:t.ox.slice(0,2)}}
  if(band==="34")return {fill:answers(t.f.slice(1,5)),ox:t.ox.slice(0,3)};
  return {fill:answers(t.f),ox:t.ox.filter(o=>!o[1]).slice(0,2)};
}
const BAND_NOTE={"12":"두 낱말 중 고르기, 그림 그리기, 말하기 중심","34":"빈칸(헷갈리는 낱말 포함), 틀린 문장 고쳐 쓰기, 약속 정하기","56":"낱말 상자 없는 핵심 내용 쓰기, 친구에게 조언하기, 까닭 밝히기, 탐구와 프로젝트"};

/* 활동지 블록: [머리띠, 목표줄, 문항…, 스스로 평가] — 화면과 PDF가 같은 블록을 씀 */
function sheetBlocks(t,band,show){
  const B=BANDS[band],S=SERIES[t.s];
  const head=`<div class="band"><div><div class="kick"><span>${S.name}</span><span>${esc(t.ep)}</span><span class="gr">${B.label}</span></div><h2>${esc(t.t)}</h2></div>
    <div class="namebox"><span>학년 반</span><span></span><span>번호</span><span></span><span>이름</span><span></span></div></div>`;
  const goal=`<div class="goalrow"><img src="${thumb(t)}" alt="${esc(t.t)} 썸네일"><div class="gl"><p><b>주제</b>${esc(t.topic)}</p><p><b>목표</b>${esc(t.goal)}</p><small>영상: <a href="${watch(t)}" target="_blank" rel="noopener">${watch(t)}</a> · ${S.ch}${t.d?" · "+t.d:""}</small></div></div>`;
  const secs=buildSections(t,band,show).map((s,i)=>`<section class="q"><h4><span class="n">${i+1}</span>${esc(s.title)}${s.sub?`<small>${esc(s.sub)}</small>`:""}</h4>${s.html}</section>`);
  const self=`<div class="self"><b>스스로 평가</b><span>영상을 집중해서 보았나요? <em>☆☆☆</em></span><span>${band==="56"?"근거를 들어 설명했나요?":"약속을 지킬 수 있나요?"} <em>☆☆☆</em></span></div>`;
  return {head,body:[goal,...secs,self]};
}
function teacherHTML(t,band){
  const ta=teacherAnswers(t,band);
  return `<aside class="teacher" aria-label="교사용 자료">
    <h3>교사용 · 관련 성취기준</h3>
    <div class="std">${STD[t.c][band].map(([s,p])=>`<div><div class="subj">${esc(s)}</div><p>${esc(p)}</p></div>`).join("")}
      <div><div class="subj">학교안전교육 7대 영역</div><p>${SAFE7[t.c]}</p></div></div>
    <dl>
      <dt>학습 목표</dt><dd>${esc(t.goal)}</dd>
      <dt>문항 구성</dt><dd>${BAND_NOTE[band]}</dd>
      <dt>${band==="12"?"고르기 정답":"빈칸 정답"}</dt><dd>${ta.fill.map((a,i)=>`${i+1}) ${esc(a)}`).join(" · ")}</dd>
      <dt>${band==="56"?"조언하기":"○× 정답"}</dt><dd>${band==="56"?ta.ox.map(o=>`"${esc(o[0])}"는 틀린 생각(×)`).join(" · ")||"없음":ta.ox.map((o,i)=>`${i+1}) ${o[1]?"○":"×"}`).join(" · ")}</dd>
      <dt>지도 팁</dt><dd>${esc(t.tip)}</dd>
    </dl>
    <p class="note">활동지는 공식 채널의 회차 제목과 주제를 바탕으로 만들었습니다. 대사와 장면까지 맞춘 것은 아니므로 수업 전에 영상을 한 번 보고 낱말을 고쳐 쓰세요. 성취기준은 2022 개정 교육과정의 교과·영역과 요지이며, 코드와 원문은 국가교육과정정보센터(NCIC)에서 확인하세요.</p>
  </aside>`;
}

let DL=null,dlChecked=false;
function renderSheet(){
  const t=byV(state.v),B=BANDS[state.band],S=SERIES[t.s],show=state.teacher;
  const {head,body}=sheetBlocks(t,state.band,show);
  const inClaude=!!(window.claude&&window.claude.use);
  const pdfUI=inClaude&&dlChecked&&!DL
    ?`<span class="toast" style="display:block">PDF 저장은 claude.ai에서 이 페이지를 열면 쓸 수 있어요. 지금은 '글 복사'를 써 주세요.</span>`
    :`<button class="btn primary" id="pdf1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>PDF 저장</button>
      <button class="btn" id="pdf3">세 학년 모두 PDF</button>${inClaude?"":`<button class="btn" id="prn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>인쇄</button>`}`;
  document.getElementById("side").innerHTML=`
  <div class="toolbar">
    ${pdfUI}
    <button class="btn" id="copy">글 복사</button>
    <span class="tb-spacer"></span>
    <div class="seg" role="group" aria-label="보기"><button id="vStu" aria-pressed="${!show}">학생용</button><button id="vTea" aria-pressed="${show}">교사용(정답)</button></div>
    <a class="btn" href="${watch(t)}" target="_blank" rel="noopener">▶ 영상</a>
    <span class="toast" id="toast" role="status"></span>
  </div>
  <article class="sheet ${S.cls}">${head}<div class="inner">${body.join("")}</div></article>
  ${show?teacherHTML(t,state.band):""}`;
  document.getElementById("vStu").onclick=()=>{state.teacher=false;renderSheet()};
  document.getElementById("vTea").onclick=()=>{state.teacher=true;renderSheet()};
  document.getElementById("copy").onclick=()=>copyText(t,B,buildSections(t,state.band,show),teacherAnswers(t,state.band));
  const p1=document.getElementById("pdf1"),p3=document.getElementById("pdf3");
  if(p1) p1.onclick=()=>savePDF(t,[state.band]);
  if(p3) p3.onclick=()=>savePDF(t,["12","34","56"]);
  const pr=document.getElementById("prn");if(pr) pr.onclick=()=>window.print();
}
function toast(msg,kind){const el=document.getElementById("toast");if(!el)return;el.textContent=msg;el.className="toast "+(kind||"");}

/* ---------- PDF ---------- */
const LIBS=["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"];
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`)&&(window.html2canvas&&src.includes("html2canvas")||window.jspdf&&src.includes("jspdf")))return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)})}
async function loadLibs(){for(const s of LIBS)await loadScript(s)}

function buildPages(root,t,band,show){
  const {head,body}=sheetBlocks(t,band,show);
  const S=SERIES[t.s],B=BANDS[band];
  const pages=[];const FOOT=70;
  const newPage=(first)=>{
    const pg=document.createElement("div");pg.className="pdf-page";
    pg.innerHTML=`<article class="sheet ${S.cls}">${first?head:""}<div class="${first?"inner":"cont"}"></div></article><div class="pdf-foot"><span>${esc(S.name)} ${esc(t.ep)} · ${esc(t.t)} · ${B.label}</span><span class="pn"></span></div>`;
    root.appendChild(pg);pages.push(pg);return pg;
  };
  const fits=pg=>{const sh=pg.querySelector(".sheet");return sh.scrollHeight<=1123-FOOT};
  let pg=newPage(true);
  const place=(html)=>{
    const box=pg.querySelector(".inner,.cont");
    const tmp=document.createElement("div");tmp.innerHTML=html;const el=tmp.firstElementChild;
    box.appendChild(el);
    if(!fits(pg)&&box.children.length>1){el.remove();pg=newPage(false);pg.querySelector(".cont").appendChild(el)}
  };
  body.forEach(place);
  if(show){pg=newPage(false);pg.querySelector(".cont").innerHTML=teacherHTML(t,band)}
  return pages;
}

async function savePDF(t,bands){
  const S=SERIES[t.s];
  const btns=[document.getElementById("pdf1"),document.getElementById("pdf3")].filter(Boolean);
  btns.forEach(b=>b.disabled=true);
  const ov=document.createElement("div");ov.className="busy";ov.innerHTML=`<div><b>PDF를 만들고 있어요</b><br><span id="bmsg">준비 중…</span><progress id="bprog" max="1" value="0"></progress></div>`;document.body.appendChild(ov);
  const root=document.createElement("div");root.className="pdf-root";document.body.appendChild(root);
  try{
    await loadLibs();
    try{await document.fonts.ready}catch(e){}
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4"});
    const all=[];bands.forEach(b=>{all.push(...buildPages(root,t,b,state.teacher))});
    await Promise.all([...root.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    all.forEach((pg,i)=>pg.querySelector(".pn").textContent=`${i+1} / ${all.length}`);
    for(let i=0;i<all.length;i++){
      document.getElementById("bmsg").textContent=`${i+1} / ${all.length}쪽 그리는 중`;
      document.getElementById("bprog").value=(i)/all.length;
      const cv=await window.html2canvas(all[i],{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
      if(i)pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297);
    }
    document.getElementById("bprog").value=1;
    const blob=pdf.output("blob");
    const who=state.teacher?" (교사용)":"";
    const gl=bands.length>1?"1~6학년":BANDS[bands[0]].label;
    const name=`${S.name} ${t.ep} ${t.t} ${gl}${who}.pdf`.replace(/[\\/:*?"<>|!]/g,"").replace(/\s+/g," ");
    ov.remove();
    if(!DL){
      /* claude.ai 밖(일반 웹사이트): 브라우저가 바로 내려받고, 새 탭에서도 열어 인쇄할 수 있게 함 */
      const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      toast(`내려받았어요: ${name}`,"ok");setTimeout(()=>URL.revokeObjectURL(url),60000);return}
    try{await DL.save({filename:name,data:blob});toast(`저장했어요: ${name}`,"ok")}
    catch(e){
      const c=e&&e.code;
      toast(c==="declined"?"저장을 취소했어요.":c==="rate_limited"?"이미 저장 창이 열려 있어요. 잠시 뒤 다시 눌러 주세요.":"이 화면에서는 PDF를 저장할 수 없어요. claude.ai에서 열어 주세요.","err");
    }
  }catch(e){
    toast("PDF를 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.","err");
  }finally{ov.remove();root.remove();btns.forEach(b=>b.disabled=false)}
}
(async()=>{try{DL=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){DL=null}dlChecked=true;renderSheet()})();

function copyText(t,B,secs,ta){
  const S=SERIES[t.s];
  let s=`[${S.name} ${t.ep}] ${t.t} (${B.label})\n주제: ${t.topic}\n학습 목표: ${t.goal}\n영상: ${watch(t)}\n학년 반 ____  번호 ____  이름 ________\n\n`;
  s+=secs.map((x,i)=>`${i+1}. ${x.title}${x.sub?` (${x.sub})`:""}\n${x.text}`).join("\n\n")+"\n";
  if(state.teacher) s+=`\n---- 교사용 ----\n`+STD[t.c][state.band].map(([a,b])=>`· ${a}: ${b}`).join("\n")+`\n· 학교안전교육 7대 영역: ${SAFE7[t.c]}\n정답: ${ta.fill.join(", ")}\n`+(state.band==="56"?"":`○× 정답: ${ta.ox.map(o=>o[1]?"○":"×").join(", ")}\n`)+`지도 팁: ${t.tip}\n`;
  const toast=document.getElementById("toast");
  const done=()=>{toast.textContent="복사했어요. 한글·워드에 붙여 넣으세요.";setTimeout(()=>toast.textContent="",3000)};
  const fallback=()=>{const x=document.createElement("textarea");x.value=s;document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(e){toast.textContent="복사가 막혔어요. 글을 직접 선택해 복사하세요."}x.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done,fallback); else fallback();
}

function fromHash(){
  const m=(location.hash||"").match(/^#v(12|34|56)-([A-Za-z0-9-]+)$/);
  if(m&&byV(fromHashId(m[2]))){state.band=m[1];state.v=fromHashId(m[2])}
}
fromHash();
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();renderList()});
window.addEventListener("hashchange",()=>{fromHash();renderList();renderSheet()});
document.getElementById("total").textContent=T.length;
renderChips();renderList();renderSheet();
</script>
